name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  accreditation:
    name: Baseline and draft role fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run accreditation fixture suite
        run: python3 validate.py
        working-directory: accreditation
      - name: Run agent assessment vectors
        run: python3 accreditation/agents/fixtures/run.py
      - name: Run intermediary assessment vectors
        run: python3 accreditation/intermediaries/fixtures/validate.py

  schema-validation:
    name: Fixtures against the standard's schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the standard at the constrained version
        uses: actions/checkout@v7
        with:
          repository: SPUR-Coalition/telemetry
          ref: v1.0
          path: standard
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the standard's validator dependency
        run: pip install "jsonschema[format-nongpl]"
      - name: Validate fixtures against the standard's schemas
        run: python3 accreditation/validate_schemas.py standard
      - name: Validate positive role fixture wire artefacts
        run: python3 accreditation/validate_role_schemas.py standard
